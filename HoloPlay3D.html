<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#150c2e;color:#fff;font-family:system-ui,sans-serif}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{display:grid;grid-template-columns:92px 1fr;grid-template-rows:auto 1fr auto;height:100%;gap:6px;padding:6px}
#top{grid-column:1/3;display:flex;gap:12px;align-items:center;background:#2a1b55;border-radius:14px;padding:8px 14px;flex-wrap:wrap}
#xpb{flex:1;min-width:120px;height:16px;background:#150c2e;border-radius:9px;overflow:hidden}#xpf{height:100%;background:linear-gradient(90deg,#ff5fa2,#ffd23f);width:0}
#side{display:flex;flex-direction:column;gap:8px}
.cb{flex:1;border:3px solid #4b3a8a;background:#2a1b55;color:#fff;border-radius:14px;font-size:12px;cursor:pointer;min-height:64px}.cb.on{border-color:#ffd23f;background:#4b2f9a}.cb b{display:block;font-size:26px}
#stage{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;background:#0c0620;border-radius:14px;overflow:hidden}
#cv{max-width:100%;max-height:100%;aspect-ratio:16/9;width:100%;object-fit:contain;touch-action:none}
#hud{position:absolute;top:8px;left:8px;right:8px;display:none;gap:10px;align-items:center;font-weight:700;font-size:18px;text-shadow:0 2px 3px #000}
#sub{position:absolute;bottom:10px;left:10%;right:10%;text-align:center;font-size:clamp(15px,2.2vw,26px);background:#000a;border-radius:10px;padding:4px 10px;display:none}
#note{position:absolute;top:8px;left:8px;right:8px;text-align:center;font-size:14px;background:#7a1f4acc;border-radius:10px;padding:4px 8px;display:none}
#cam{position:absolute;right:8px;bottom:8px;width:240px;z-index:3;display:none;background:#000;border-radius:10px;overflow:hidden;border:2px solid #ffd23f}
#cam video,#cam canvas{width:100%;display:block;transform:scaleX(-1)}#vw{position:relative;aspect-ratio:4/3;background:#000}#cam video{height:100%}#cam canvas{position:absolute;inset:0;height:100%}#cs{font-size:12px;padding:4px 6px;background:#000d;line-height:1.4;text-align:left}#cb2{display:flex;gap:4px;padding:4px;background:#000d}#cb2 button{flex:1;min-height:34px;padding:4px;font-size:13px}#gl{font-size:13px;text-align:center;padding:2px;background:#000c;position:relative}
#pad{position:absolute;left:8px;bottom:8px;display:none;gap:8px}#pad button{width:64px;height:64px;font-size:26px}
#panel{position:absolute;inset:0;background:#150c2ef0;display:none;overflow:auto;padding:16px;font-size:16px}#panel h2{margin-top:0}
#bot{grid-column:1/3;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#2a1b55;border-radius:14px;padding:8px}
button,select,input{font:inherit;color:#fff;background:#4b2f9a;border:2px solid #7a5bd6;border-radius:12px;padding:10px 14px;min-height:46px}button{cursor:pointer}button:hover{background:#6240c4}button.on{background:#d6246e}
#txt{flex:1;min-width:140px;background:#150c2e}table{border-collapse:collapse}td,th{border:1px solid #7a5bd6;padding:6px 10px}
@media(max-width:700px){#app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto}#top,#bot{grid-column:1}#side{flex-direction:row}#cam{width:180px}}
#g3{position:absolute;inset:0;width:100%;height:100%;display:block}#cv{position:relative}#stage.g3 #cv{position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none;aspect-ratio:auto}#fl{position:absolute;inset:0;background:#f22;opacity:0;pointer-events:none;transition:opacity .3s}

<script>
const $=s=>document.querySelector(s),CV=$('#cv'),X=CV.getContext('2d'),W=1280,H=720;CV.width=2560;CV.height=1440;
const CH={ironman:{n:'Iron Man',ta:'அயர்ன் மேன்',c:'#d62828',c2:'#f4c542',sk:'#f0c8a0',eye:'#22d3ee',pitch:.7,rate:.95,ic:'🤖',tap:['hover','wave','power'],joke:'I charge up faster than your phone!',pers:'Confident and witty'},
hulk:{n:'Hulk',ta:'ஹல்க்',c:'#4caf50',c2:'#7b3fa0',sk:'#5fbf5a',eye:'#a3e635',pitch:.2,rate:.8,ic:'💪',tap:['laugh','clap','jump','power'],joke:'Hulk smash boring days!',pers:'Big-hearted and goofy'},
tony:{n:'Tony Stark',ta:'டோனி ஸ்டார்க்',c:'#1c2236',c2:'#d62828',sk:'#f0c8a0',eye:'#6b4a2f',pitch:.55,rate:.95,ic:'🕶',tap:['wave','laugh','power','celebrate','think'],joke:'I told Jarvis a joke. He said he would process it. Genius, billionaire, comedian!',pers:'Witty genius'},
cap:{n:'Captain America',ta:'கேப்டன் அமெரிக்கா',c:'#1d4ed8',c2:'#e5e7eb',sk:'#f0c8a0',eye:'#3b82f6',pitch:.85,rate:.9,ic:'🛡',tap:['salute','wave','power','celebrate'],joke:'I can do this all day, even jokes!',pers:'Kind and noble'}};
const DUR={wave:2,dance:3,jump:1,power:2.4,celebrate:2.4,laugh:2.2,clap:2.2,salute:2,think:2.4,hover:2.4,talk:1};
const ITEMS=[{id:'outfit',n:'Alt outfit colours',p:100},{id:'color',n:'Rainbow suit',p:80},{id:'dance',n:'Spin dance',p:60},{id:'fx',n:'Heart effects',p:120}];
let S=load();if(S.cfg.shk===undefined)S.cfg.shk=1;let sel='ironman',mode='play',act={n:null,t0:0},T=0,talk=0,P=[],shake=0,run=null,camOn=false,lastSeen=0,lm=null,stream=null,lastGest='';
function load(){try{const d=JSON.parse(localStorage.getItem('holo1'));if(d&&d.ch){if(d.ch.thor&&!d.ch.tony){d.ch.tony=d.ch.thor;delete d.ch.thor}return d}}catch(e){}return{dia:0,ch:{},cfg:{sound:1,music:0,vol:.9,sub:1,fx:2,rm:matchMedia('(prefers-reduced-motion:reduce)').matches?1:0,lang:'en',mode:'talk',fun:0}}}
function save(){try{localStorage.setItem('holo1',JSON.stringify(S))}catch(e){}}
const getC=id=>S.ch[id]||(S.ch[id]={lvl:1,xp:0,b:{},un:{}});
function addXp(id,n){const c=getC(id);c.xp+=n;while(c.xp>=100*c.lvl){c.xp-=100*c.lvl;c.lvl++}return c}
function buy(id,item){const c=getC(id);if(c.un[item.id]||S.dia<item.p)return false;S.dia-=item.p;c.un[item.id]=1;save();return true}
function endRun(){if(!run||run.done)return;run.done=true;run.xp=Math.floor(run.score/4);addXp(sel,run.xp);S.dia+=run.dia;const c=getC(sel);c.b[run.k]=Math.max(c.b[run.k]||0,run.score);save();top_()}
const rm=()=>S.cfg.rm,Q=()=>[.2,.5,1][S.cfg.fx]*(rm()?.3:1);
const note=t=>{const n=$('#note');n.textContent=t;n.style.display=t?'block':'none';if(t)setTimeout(()=>{if(n.textContent===t)n.style.display='none'},6000)};
/* ---------- audio ---------- */
let AC;function beep(f,d=.1,ty='square'){if(!S.cfg.sound)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.value=.05*S.cfg.vol;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
let mi=0;setInterval(()=>{if(S.cfg.music&&S.cfg.sound){beep([262,330,392,330,294,370,440,370][mi++%8],.25,'triangle')}},300);
/* ---------- speech ---------- */
const ss=window.speechSynthesis;
function voices(){const l=S.cfg.lang,v=$('#voice');v.innerHTML='';if(!ss)return;const vs=ss.getVoices().filter(x=>x.lang.toLowerCase().startsWith(l));vs.forEach(x=>v.add(new Option(x.name,x.name)));if(!vs.length)v.add(new Option('(no '+(l==='ta'?'Tamil':'English')+' voice)',''))}
if(ss)ss.onvoiceschanged=voices;
function sub(t,lbl){const s=$('#sub');if(!S.cfg.sub||!t){s.style.display='none';return}s.textContent=(lbl?lbl+' ':'')+t;s.style.display='block'}
function say(t,o={}){const l=S.cfg.lang;sub(t,o.lbl);perform('talk');if(!ss){note('Speech is not supported here — showing subtitles only.');talk=1;setTimeout(()=>talk=0,1200);return}
ss.cancel();const u=new SpeechSynthesisUtterance(t),c=CH[sel];u.lang=l==='ta'?'ta-IN':'en-US';const vs=ss.getVoices().filter(x=>x.lang.toLowerCase().startsWith(l)),pick=vs.find(x=>x.name===$('#voice').value)||vs[0];
if(pick)u.voice=pick;else note((l==='ta'?'No Tamil':'No English')+' voice is installed on this device. Subtitles are shown; install a voice in your system settings for audio.');
u.pitch=Math.min(2,c.pitch*(S.cfg.fun?1.8:1)+.3);u.rate=c.rate*(S.cfg.fun?1.15:1);u.volume=S.cfg.vol;u.onstart=()=>talk=1;u.onend=u.onerror=()=>{talk=0};ss.speak(u)}
function reply(t){const c=CH[sel],l=S.cfg.lang,s=t.toLowerCase();if(l==='ta'){if(/வணக்கம்|ஹாய்|hi|hello/.test(s))return`வணக்கம்! நான் ${c.ta}. உங்களை சந்தித்ததில் மகிழ்ச்சி!`;if(/எப்படி|how/.test(s))return'நான் நன்றாக இருக்கிறேன்! விளையாடலாமா?';if(/நகைச்சுவை|joke/.test(s))return'ஒரு சிரிப்பு: நான் ஹீரோ, ஆனால் நீங்கள் தான் என் ஃபேவரைட்!';return`${c.ta} சொல்கிறார்: சூப்பர்! ஒரு விளையாட்டு விளையாடலாமா?`}
